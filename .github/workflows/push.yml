name: Push to Galaxy

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  push:
    name: 'Push to Galaxy'

    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install collection build tools
        run: python -m pip install "ansible-core==2.19.5"
      - name: Show tool versions
        run: |
          python --version
          ansible-galaxy --version
      - name: Build collection
        run: |
          mkdir -p "$RUNNER_TEMP/galaxy-artifacts"
          ansible-galaxy collection build --output-path "$RUNNER_TEMP/galaxy-artifacts"
      - name: Publish collection to Galaxy
        env:
          ANSIBLE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
        run: ansible-galaxy collection publish --token "$ANSIBLE_GALAXY_TOKEN" "$RUNNER_TEMP"/galaxy-artifacts/*.tar.gz
